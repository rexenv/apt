# Publish the apt repository: rebuild the whole site from the newest published releases on
# rexenv/homebrew-tap, sign it, prove the runner's own apt accepts it, deploy it to Pages.
#
# Run it after a release is PUBLISHED on the tap (a draft's assets are not public). The build job
# runs in the `apt-signing` environment — the only place the private key exists — and that
# environment has a required reviewer: reading the key is a human approval GitHub logs, the same
# rule the app-update descriptors keep in rexenv/runtimes.
name: Publish apt repository

on:
  workflow_dispatch:
    inputs:
      keep:
        description: "How many of the newest published releases the repository carries"
        required: false
        default: "3"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-latest
    environment: apt-signing
    steps:
      - uses: actions/checkout@v4
      - name: Build the site from the tap's releases
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          KEEP: ${{ inputs.keep }}
        run: ./scripts/build-site.sh site
      - name: The runner's apt accepts it (signature, indexes, newest candidate)
        run: sudo ./scripts/self-test.sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
